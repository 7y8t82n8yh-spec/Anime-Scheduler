[package]
name = "anime-frontend"
description = "Anime Scheduler browser UI, written in Rust and compiled to WebAssembly"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anime-shared.workspace = true
chrono = { workspace = true, features = ["wasmbind"] }
console_error_panic_hook = "0.1"
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
gloo-timers = "0.3"
js-sys = "0.3"
leptos = { version = "0.8", features = ["csr"] }
serde.workspace = true
wasm-bindgen-futures = "0.4"
wasm-bindgen = "=0.2.130"
web-sys = { version = "0.3", features = ["Notification", "NotificationOptions", "NotificationPermission", "Storage", "Window", "Location", "History", "HtmlInputElement", "HtmlSelectElement", "HtmlDetailsElement", "FormData", "HtmlFormElement"] }
