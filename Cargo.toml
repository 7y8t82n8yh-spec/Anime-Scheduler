[workspace]
resolver = "2"
members = ["shared", "server", "frontend"]
default-members = ["shared", "server"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
rust-version = "1.82"

# No unsafe code anywhere in this project.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
anime-shared = { path = "shared" }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release.package.anime-frontend]
opt-level = "z"

[profile.release]
lto = true
codegen-units = 1
strip = true
